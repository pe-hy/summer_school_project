<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Submission guide · Ostr-AI AI Summer School 2026</title>
  <meta name="description" content="How to build and upload the predictions.json file for the Ostr-AI AI Summer School 2026 final project leaderboard.">
  <meta name="color-scheme" content="light">
  <!-- Also reachable at /static/guide.html, which the host serves directly. -->
  <link rel="canonical" href="/guide">
  <link rel="icon" type="image/png" href="/static/favicon.png?v=__V__">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
  <link rel="stylesheet" href="/static/style.css?v=__V__">
  <style>
    .guide { max-width: 72ch; margin: 0 auto; padding: 1.5rem 0 3rem; }
    .guide-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.6rem 2rem 2rem; }
    .guide h1 { font-family: var(--font-display); color: var(--navy); font-size: 1.9rem; line-height: 1.2; margin: 0 0 1rem; text-wrap: balance; }
    .guide h2 { font-family: var(--font-display); color: var(--navy); font-size: 1.25rem; margin: 1.8rem 0 .6rem; }
    .guide p, .guide li { line-height: 1.6; }
    .guide ul { padding-left: 1.3rem; }
    .guide table { border-collapse: collapse; width: 100%; margin: .6rem 0 1rem; font-size: .93rem; }
    .guide th, .guide td { border: 1px solid var(--line); padding: .45rem .7rem; text-align: left; vertical-align: top; }
    .guide th { background: var(--navy); color: #fff; font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
    .guide tbody tr:nth-child(even) { background: #fafbfe; }
    .guide pre { background: #0f1f52; color: #e9eefb; padding: .9rem 1.1rem; border-radius: 8px; overflow-x: auto; font-family: var(--font-mono); font-size: .88rem; line-height: 1.5; }
    .guide pre code { background: none; color: inherit; padding: 0; font-size: inherit; }
    .guide .table-wrap { overflow-x: auto; }
    .guide .back { display: inline-block; margin-bottom: 1rem; font-weight: 600; }
    @media print {
      .guide th { background: #fff !important; color: #000 !important; border-bottom: 2px solid #000; }
      .guide pre { background: #fff !important; color: #000 !important; border: 1px solid #999; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <img src="/static/logo.png?v=__V__" alt="" class="brand-logo" width="88" height="86">
        <div class="brand-text">
          <span class="brand-kicker">Ostr-AI · AI Summer School 2026</span>
          <p class="brand-title">Final Project Leaderboard</p>
        </div>
      </a>
      <div class="header-actions">
        <nav class="header-nav" aria-label="Main">
          <a class="btn btn-ghost" href="/">Leaderboard</a>
          <a class="btn btn-ghost" href="/assignment">Assignment</a>
          <a class="btn btn-ghost" href="/guide" aria-current="page">Submission guide</a>
        </nav>
        <a class="btn btn-primary" href="/#upload">Upload predictions</a>
      </div>
    </div>
  </header>

  <main class="container guide" id="main" tabindex="-1">
    <article class="guide-card" id="guide">
      <p>Loading the guide…</p>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>Ostr-AI · AI Summer School 2026, Ostrava</span>
      <span class="footer-sep" aria-hidden="true">·</span>
      <nav class="footer-nav" aria-label="Footer">
        <a href="/">Leaderboard</a>
        <span class="footer-sep" aria-hidden="true">·</span>
        <a href="/assignment">Assignment</a>
        <span class="footer-sep" aria-hidden="true">·</span>
        <a href="/guide" aria-current="page">Submission guide</a>
        <span class="footer-sep" aria-hidden="true">·</span>
        <a href="/data/benchmarks.zip">Benchmark data (zip)</a>
        <span class="footer-sep" aria-hidden="true">·</span>
        <a href="/submit_readme.md">submit_readme.md (raw)</a>
      </nav>
    </div>
  </footer>

  <script src="/static/md.js?v=__V__"></script>
  <script>
  (() => {
    "use strict";
    const target = document.getElementById("guide");
    fetch("/submit_readme.md", { cache: "no-store" })
      .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.text(); })
      .then((md) => { target.innerHTML = window.renderMarkdown(md); })
      .catch((e) => {
        target.textContent = `Could not load the guide (${e.message}).`;
      });
  })();
  </script>
</body>
</html>
